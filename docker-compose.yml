version: '3.8'

services:
  interview-guide:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interview-guide-app
    ports:
      - "8080:8080"
    environment:
      # Required: Set your Google Gemini API key here
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:?Error: GOOGLE_API_KEY environment variable is not set}
      # Optional: JVM memory settings
      - JAVA_OPTS=-Xms256m -Xmx512m
      # Optional: Logging level (INFO, DEBUG, WARN)
      - LOG_LEVEL=INFO
      # Optional: Application timezone
      - TZ=UTC
    volumes:
      # Optional: Mount logs directory for persistence
      - ./logs:/app/logs
    restart: unless-stopped
    # Health check configuration
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/topics"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - interview-guide-network
    # Resource limits (optional but recommended)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

networks:
  interview-guide-network:
    driver: bridge

